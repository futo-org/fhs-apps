name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  changes:
    name: Detect a docs only PR
    runs-on: ubuntu-latest
    outputs:
      docs-only: ${{ steps.diff.outputs.docs-only }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        name: Check whether the PR changes only docs
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          if git diff --quiet "$BASE_REF...HEAD" -- . ':(exclude)docs' ':(exclude)README.md' ':(exclude)CONTEXT.md' \
            ':(exclude).kritika.yaml' ':(exclude).github/pull_request_template.md'; then
            echo "docs-only=true" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint tooling (shfmt, shellcheck)
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - run: mise run lint

  test:
    name: Test tooling (scripts/*.test.sh)
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - uses: ./.github/actions/compose
      - run: mise run test

  store:
    name: Validate store (manifests, releases, history, renders)
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - uses: ./.github/actions/compose
      - name: Validate manifests, release folders, history and renders
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: mise run validate

  validate:
    if: always()
    needs: [changes, lint, test, store]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every check passed or was skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  run-apps:
    if: github.event_name == 'pull_request' && needs.changes.outputs.docs-only != 'true'
    needs: [changes, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - uses: ./.github/actions/compose
      - name: Install and update changed apps
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          apps=$(git diff --name-only "$BASE_REF...HEAD" -- '*/latest/**' ':(exclude)_*' | cut -d/ -f1 | sort -u)
          for app in $apps; do
            mise run ci-run install "$app"
            mise run ci-run update "$app"
            docker image prune -af > /dev/null
          done

  publish:
    if: github.event_name == 'push'
    needs: validate
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/publish.yml
    secrets:
      OCI_FUTO_ORG_USERNAME: ${{ secrets.OCI_FUTO_ORG_USERNAME }}
      OCI_FUTO_ORG_TOKEN: ${{ secrets.OCI_FUTO_ORG_TOKEN }}

  test-store:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.changes.outputs.docs-only != 'true'
    needs: [changes, validate]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish.yml
