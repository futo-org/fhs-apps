name: Validate store

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - run: mise run lint
      - run: mise run test
      - name: Validate manifests, release folders, history and renders
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: mise run validate

  # Trial (ticket 140): smoke install and update test for apps whose latest/ changed.
  run-apps:
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - name: Install and update changed apps
        run: |
          apps=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- '*/latest/**' | cut -d/ -f1 | sort -u)
          for app in $apps; do
            mise run ci-run install "$app"
            mise run ci-run update "$app"
          done
