name: Validate store

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

env:
  PINNED_COMPOSE_VERSION: 5.7.1
  PINNED_COMPOSE_SHA256: af426722a8af5de812fcee30cc1c39f0639f5f723cbadefb25e5d4db054064cf

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - name: Pin docker compose ${{ env.PINNED_COMPOSE_VERSION }}, the OS image's
        run: |
          mkdir -p ~/.docker/cli-plugins
          curl -fsSL -o ~/.docker/cli-plugins/docker-compose \
            "https://github.com/docker/compose/releases/download/v$PINNED_COMPOSE_VERSION/docker-compose-linux-x86_64"
          echo "$PINNED_COMPOSE_SHA256  $HOME/.docker/cli-plugins/docker-compose" | sha256sum -c
          chmod +x ~/.docker/cli-plugins/docker-compose
          docker compose version
      - run: mise run lint
      - run: mise run test
      - name: Validate manifests, release folders, history and renders
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: mise run validate

  run-apps:
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - name: Pin docker compose ${{ env.PINNED_COMPOSE_VERSION }}, the OS image's
        run: |
          mkdir -p ~/.docker/cli-plugins
          curl -fsSL -o ~/.docker/cli-plugins/docker-compose \
            "https://github.com/docker/compose/releases/download/v$PINNED_COMPOSE_VERSION/docker-compose-linux-x86_64"
          echo "$PINNED_COMPOSE_SHA256  $HOME/.docker/cli-plugins/docker-compose" | sha256sum -c
          chmod +x ~/.docker/cli-plugins/docker-compose
          docker compose version
      - name: Install and update changed apps
        run: |
          apps=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- '*/latest/**' ':(exclude)_*' | cut -d/ -f1 | sort -u)
          for app in $apps; do
            mise run ci-run install "$app"
            mise run ci-run update "$app"
            docker image prune -af > /dev/null
          done
