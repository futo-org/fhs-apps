name: Validate store

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      # Merge rules live in docker compose, so CI renders with the version the
      # OS image ships (os/rpm.lock docker-compose-plugin). Bump them together.
      - name: Pin docker compose 5.6.0
        run: |
          mkdir -p ~/.docker/cli-plugins
          curl -fsSL -o ~/.docker/cli-plugins/docker-compose \
            https://github.com/docker/compose/releases/download/v5.6.0/docker-compose-linux-x86_64
          echo "40343e21ca777173e69cff5dbafeb37c6f81f3b0d57d9e597f036e95eb63e76a  $HOME/.docker/cli-plugins/docker-compose" | sha256sum -c
          chmod +x ~/.docker/cli-plugins/docker-compose
          docker compose version
      - run: mise run lint
      - run: mise run test
      - name: Validate manifests, release folders, history and renders
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: mise run validate

  # Trial (ticket 140): smoke install and update test for apps whose latest/ changed.
  run-apps:
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      # Merge rules live in docker compose, so CI renders with the version the
      # OS image ships (os/rpm.lock docker-compose-plugin). Bump them together.
      - name: Pin docker compose 5.6.0
        run: |
          mkdir -p ~/.docker/cli-plugins
          curl -fsSL -o ~/.docker/cli-plugins/docker-compose \
            https://github.com/docker/compose/releases/download/v5.6.0/docker-compose-linux-x86_64
          echo "40343e21ca777173e69cff5dbafeb37c6f81f3b0d57d9e597f036e95eb63e76a  $HOME/.docker/cli-plugins/docker-compose" | sha256sum -c
          chmod +x ~/.docker/cli-plugins/docker-compose
          docker compose version
      - name: Install and update changed apps
        run: |
          apps=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- '*/latest/**' | cut -d/ -f1 | sort -u)
          for app in $apps; do
            mise run ci-run install "$app"
            mise run ci-run update "$app"
          done
