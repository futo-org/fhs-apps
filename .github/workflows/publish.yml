name: Publish store

on:
  workflow_call:
    secrets:
      OCI_FUTO_ORG_USERNAME:
        required: false
      OCI_FUTO_ORG_TOKEN:
        required: false

jobs:
  store:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: publish-store
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - name: Log in to ghcr.io and oci.futo.org
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OCI_FUTO_ORG_USERNAME: ${{ secrets.OCI_FUTO_ORG_USERNAME }}
          OCI_FUTO_ORG_TOKEN: ${{ secrets.OCI_FUTO_ORG_TOKEN }}
        run: |
          if [[ -z "$OCI_FUTO_ORG_USERNAME" || -z "$OCI_FUTO_ORG_TOKEN" ]]; then
            echo "::error::the OCI_FUTO_ORG_USERNAME and OCI_FUTO_ORG_TOKEN secrets aren't set: add the oci.futo.org fhs-apps robot account to this repository's secrets"
            exit 1
          fi
          echo "$GITHUB_TOKEN" | oras login ghcr.io -u USERNAME --password-stdin
          echo "$OCI_FUTO_ORG_TOKEN" | oras login oci.futo.org -u "$OCI_FUTO_ORG_USERNAME" --password-stdin
      - run: mise run publish commit

  test-store:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: test-store-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - name: Log in to ghcr.io
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | oras login ghcr.io -u USERNAME --password-stdin
      - name: Push store:pr-<number>
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: mise run publish pr "$PR_NUMBER"
