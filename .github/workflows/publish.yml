name: Publish releases

# Every merge that changes an app's latest/ becomes its next release:
# scripts/publish.sh freezes latest/ into releases/<n+1>/ and appends the
# manifest entry; the bot commits and pushes. Runs one at a time, in merge order.
on:
  push:
    branches: [master]
    paths:
      - "*/latest/**"

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          # Must be allowed to push past master's branch protection.
          token: ${{ secrets.PUBLISH_TOKEN }}
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - name: Publish and push
        run: |
          git config user.name "fhs-apps-bot"
          git config user.email "fhs-apps-bot@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin master
            git reset --hard origin/master
            for manifest in */manifest.json; do
              case $manifest in _*) continue ;; esac
              app=${manifest%/manifest.json}
              mise run -q publish-app "$app"
            done
            if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
              echo "nothing to publish"
              exit 0
            fi
            git add -A
            git commit -m "$(git diff --cached --name-only -- '*/manifest.json' | cut -d/ -f1 | while read -r app; do
              printf '%s: release %s; ' "$app" "$(jq '.releases | length' "$app/manifest.json")"
            done)"
            BASE_REF=origin/master mise run validate
            if git push origin HEAD:master; then
              exit 0
            fi
            echo "push raced, retrying ($attempt)"
            sleep 5
          done
          exit 1
