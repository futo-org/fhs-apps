# Store tooling: `mise install` provides shellcheck and shfmt; `mise run <task>` runs it.
# Scripts are bash and need jq and docker on the host, like the device.
[tools]
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:mvdan/sh" = "3.13.1"

[settings]
pin = true

[tasks.validate]
description = "Validate the store. Env: BASE_REF checks published history, SKIP_RENDER=1 skips renders"
run = "bash scripts/validate-store.sh"

[tasks.render]
description = "Print the compose a device would run: <release-dir> <app-id> [values.json]"
run = "bash scripts/render.sh"

[tasks.new-app]
description = "Start an app from _template/: <app-id> <app-port>"
run = "bash scripts/new-app.sh"

[tasks.publish-app]
description = "Freeze each unreleased merge of <app>/latest/ into the next release (publish workflow only): <app-id>"
run = "bash scripts/publish.sh"

[tasks.ci-run]
description = "Run an app like a device, pulls images: install|update <app-id>"
run = "bash scripts/ci-run.sh"

[tasks.lint]
description = "Lint the tooling (shfmt format check + shellcheck)"
run = ["shfmt -d scripts", "shellcheck -x -P SCRIPTDIR scripts/*.sh"]

[tasks.lint-fix]
description = "Format the tooling with shfmt"
run = "shfmt -w scripts"

[tasks.test]
description = "Run the tooling's tests (need docker)"
run = 'status=0; for test in scripts/*.test.sh; do bash "$test" || status=1; done; exit $status'
